plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProperties.load(it) }
}
def sdlDir = localProperties.getProperty('sdl.dir')
if (sdlDir == null) {
    throw new GradleException('sdl.dir is not set in android/local.properties')
}
def repoDir = rootProject.projectDir.parentFile
def generatedDir = layout.buildDirectory.dir('generated/alouette_chess').get().asFile

android {
    namespace = 'io.github.rchastain2.alouette_chess'
    compileSdk = 35
    buildToolsVersion = '35.0.0'
    ndkVersion = '28.2.13676358'
    defaultConfig {
        applicationId = 'io.github.rchastain2.alouette_chess'
        minSdk = 21
        targetSdk = 35
        versionCode = 1
        versionName = '0.2.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled = false
        }
    }
    sourceSets.main {
        java.srcDirs += "$sdlDir/android-project/app/src/main/java"
        jniLibs.srcDirs = ['libs']
        assets.srcDirs = ["$generatedDir/assets"]
        res.srcDirs += "$generatedDir/res"
    }
    lint {
        abortOnError = false
    }
}

def copyGameAssets = tasks.register('copyGameAssets', Sync) {
    from(repoDir) {
        include 'images/**', 'sounds/**', 'fonts/**', 'engine/white.txt', 'engine/black.txt'
        exclude 'images/*.ico'
    }
    into "$generatedDir/assets"
}

def copyLauncherIcon = tasks.register('copyLauncherIcon', Sync) {
    from("$repoDir/images/icon.png") {
        rename { 'ic_launcher.png' }
    }
    into "$generatedDir/res/mipmap-nodpi"
}

preBuild.dependsOn copyGameAssets, copyLauncherIcon

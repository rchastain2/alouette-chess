plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProperties.load(it) }
}
def sdlDir = localProperties.getProperty('sdl.dir')
if (sdlDir == null) {
    throw new GradleException('sdl.dir is not set in android/local.properties')
}
def repoDir = rootProject.projectDir.parentFile
def versionMatch = new File(repoDir, 'source/alouette_chess.pas').text =~ /CAppVersion = '(\d+)\.(\d+)\.(\d+)'/
if (!versionMatch.find()) {
    throw new GradleException('CAppVersion not found in source/alouette_chess.pas')
}
def appVersionName = "${versionMatch.group(1)}.${versionMatch.group(2)}.${versionMatch.group(3)}"
def appVersionCode = versionMatch.group(1).toInteger() * 10000 + versionMatch.group(2).toInteger() * 100 + versionMatch.group(3).toInteger()
def releaseStore = localProperties.getProperty('release.storeFile')
def generatedDir = layout.buildDirectory.dir('generated/alouette_chess').get().asFile

android {
    namespace = 'io.github.rchastain2.alouette_chess'
    compileSdk = 35
    buildToolsVersion = '35.0.0'
    ndkVersion = '28.2.13676358'
    defaultConfig {
        applicationId = 'io.github.rchastain2.alouette_chess'
        minSdk = 21
        targetSdk = 35
        versionCode = appVersionCode
        versionName = appVersionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    signingConfigs {
        if (releaseStore != null) {
            release {
                storeFile = file(releaseStore)
                storePassword = localProperties.getProperty('release.storePassword')
                keyAlias = localProperties.getProperty('release.keyAlias')
                keyPassword = localProperties.getProperty('release.keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled = false
            if (releaseStore != null) {
                signingConfig = signingConfigs.release
            }
        }
    }
    sourceSets.main {
        java.srcDirs += "$sdlDir/android-project/app/src/main/java"
        jniLibs.srcDirs = ['libs']
        assets.srcDirs = ["$generatedDir/assets"]
    }
    lint {
        abortOnError = false
    }
}

def copyGameAssets = tasks.register('copyGameAssets', Sync) {
    from(repoDir) {
        include 'images/**', 'sounds/**', 'fonts/**', 'engine/white.txt', 'engine/black.txt'
        exclude 'images/*.ico'
    }
    into "$generatedDir/assets"
}

preBuild.dependsOn copyGameAssets
